name: integrated-release-candidate
on:
  workflow_call:
    inputs:
      run-id:
        type: string
        required: true
      source-workflow:
        type: string
        default: .github/workflows/main-ci.yml
      files:
        type: string
        default: '["dist/*.whl","dist/*.tar.gz"]'
    outputs:
      status:
        value: ${{ jobs.candidate.outputs.status }}
      artifact-name:
        value: ${{ jobs.candidate.outputs.artifact-name }}
permissions: {}
jobs:
  candidate:
    if: ${{ github.event.repository.private == false && ((github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      status: ${{ steps.complete.outputs.status }}
      artifact-name: ${{ steps.complete.outputs.name }}
    steps:
      - id: prepare
        uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/prepare-release@60f52ba1978b97343483a45d22edb6e338e0e3f5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          run-id: ${{ inputs.run-id }}
          source-workflow: ${{ inputs.source-workflow }}
          files: ${{ inputs.files }}
      - name: Retain the complete candidate without signatures
        id: verify
        env:
          NDDEV_CANDIDATE: ${{ steps.prepare.outputs.candidate }}
          NDDEV_SBOM: ${{ steps.prepare.outputs.sbom }}
        run: |
          set -euo pipefail
          publication="$RUNNER_TEMP/nddev-publication"
          mkdir "$publication"
          cp "$NDDEV_CANDIDATE" "$publication/candidate.tar.gz"
          cp "$NDDEV_SBOM" "$publication/sbom.spdx.json"
          (cd "$publication" && sha256sum candidate.tar.gz sbom.spdx.json > SHA256SUMS)
          echo "name=release-candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.verify.outputs.name }}
          path: ${{ runner.temp }}/nddev-publication
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
      - id: complete
        env:
          NDDEV_CANDIDATE_NAME: ${{ steps.verify.outputs.name }}
        run: |
          echo "status=success" >> "$GITHUB_OUTPUT"
          echo "name=$NDDEV_CANDIDATE_NAME" >> "$GITHUB_OUTPUT"
