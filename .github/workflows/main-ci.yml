        python3 - <<'PY'
        from pathlib import Path
        summaries = list(Path('out/artifacts/native_parser/undefined').glob('*.summary'))
        assert summaries and all(path.stat().st_size for path in summaries)
        assert all(path.with_suffix('').is_file() for path in summaries)
        PY
