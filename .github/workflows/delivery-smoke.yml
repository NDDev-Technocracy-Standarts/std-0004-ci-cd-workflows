name: integrated-delivery-smoke
on:
  push:
    branches: [dev, main]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: integrated-smoke-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source-run-id: ${{ steps.fixture.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          enable-cache: 'false'
          python-version: '3.13'
      - name: Prepare only the authorized temporary target and select the merged source run
        id: fixture
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --locked python scripts/delivery-smoke.py prepare "$RUNNER_TEMP/integrated-smoke"
      - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/deliver@3c36acdc62389493e907d77e36d89f4ceaac3eb4 # 0.2.0 draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          run-id: ${{ steps.fixture.outputs.run_id }}
          target-config: ${{ steps.fixture.outputs.target }}
          transport-config: ${{ steps.fixture.outputs.transport }}
      - name: Publish the exact tested OCI archive to the owned HTTPS registry
        id: image
        uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/oci-publish@3c36acdc62389493e907d77e36d89f4ceaac3eb4 # 0.2.0 draft
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          run-id: ${{ steps.fixture.outputs.run_id }}
          repository: ${{ steps.fixture.outputs.oci_repository }}
          certificates: ${{ steps.fixture.outputs.oci_certificates }}
      - name: Verify the remote served revision and stop the owned SSH server
        if: ${{ always() && steps.fixture.outcome == 'success' }}
        env:
          NDDEV_PUBLISHED_IMAGE: ${{ steps.image.outputs.image }}
          NDDEV_PUBLISHED_DIGEST: ${{ steps.image.outputs.digest }}
        run: uv run --locked python scripts/delivery-smoke.py finish "$RUNNER_TEMP/integrated-smoke"
      - name: Remove only owned isolated targets even after interrupted preparation
        if: ${{ always() }}
        run: uv run --locked python scripts/delivery-smoke.py cleanup "$RUNNER_TEMP/integrated-smoke"
  release:
    needs: artifact
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/workflows/release.yml@0a14a44245cd04e70e88dd8bc82455fa943c3307 # 0.2.0 draft
    with:
      run-id: ${{ needs.artifact.outputs.source-run-id }}
