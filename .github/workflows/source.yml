name: Reusable source validation
on:
  workflow_call:
    inputs:
      contract:
        type: string
        default: .github/nddev-ci.toml
      uv:
        type: string
        default: '0.13.5'
      python:
        type: string
        default: '3.13'
    outputs:
      library-ref:
        description: Exact implementation commit to use for the delivery composite
        value: ${{ jobs.source.outputs.library-ref }}
      status:
        description: Success only when actual selected source checks completed
        value: ${{ jobs.source.outputs.status }}
permissions:
  contents: read
jobs:
  source:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-24.04
    outputs:
      library-ref: '41cae0cce946f9af485281210001f4590fe2a686'
      status: ${{ steps.native.outputs.status }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ inputs.uv }}
          python-version: ${{ inputs.python }}
          enable-cache: 'false'
      - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/ci@41cae0cce946f9af485281210001f4590fe2a686
        id: native
        with:
          contract: ${{ inputs.contract }}
          python: ${{ inputs.python }}
  gate:
    needs: [source]
    if: ${{ !cancelled() && github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULT: ${{ needs.source.result }}
        run: test "$RESULT" = success
