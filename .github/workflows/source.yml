name: Reusable source validation
on:
  workflow_call:
    inputs:
      contract:
        type: string
        default: .github/nddev-ci.toml
      uv:
        type: string
        default: '0.13.1'
      python:
        type: string
        default: '3.13'
    outputs:
      library-ref:
        description: Exact implementation commit to use for the delivery composite
        value: ${{ jobs.source.outputs.library-ref }}
      status:
        description: Success only when actual selected source checks completed
        value: ${{ jobs.source.outputs.status }}
permissions:
  contents: read
jobs:
  source:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-24.04
    outputs:
      library-ref: '3a055118260e826801dfcc20d346d98d81d07605'
      status: ${{ steps.native.outputs.status }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ inputs.uv }}
          python-version: ${{ inputs.python }}
          enable-cache: 'false'
      - uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/ci@3a055118260e826801dfcc20d346d98d81d07605
        id: native
        with:
          contract: ${{ inputs.contract }}
          python: ${{ inputs.python }}
  gate:
    needs: [source]
    if: ${{ !cancelled() && github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULT: ${{ needs.source.result }}
        run: test "$RESULT" = success
