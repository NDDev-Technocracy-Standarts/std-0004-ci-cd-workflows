name: Bounded native ClusterFuzzLite
description: Build and batch-fuzz a project on an ephemeral public GitHub Linux executor
inputs:
  phase:
    description: all, build or run; split phases allow native corpus preparation after build validation
    default: all
  sanitizer:
    description: Native address, undefined or memory sanitizer
    default: address
  seconds:
    description: Explicit total fuzzing budget from one to six hundred seconds
    required: true
runs:
  using: composite
  steps:
    - name: Require the SDK's disposable executor and bounded native inputs
      shell: bash
      env:
        NDDEV_PUBLIC: ${{ github.event.repository.private == false }}
        NDDEV_PHASE: ${{ inputs.phase }}
        NDDEV_SANITIZER: ${{ inputs.sanitizer }}
        NDDEV_SECONDS: ${{ inputs.seconds }}
      run: |
        set -euo pipefail
        test "$RUNNER_ENVIRONMENT" = github-hosted
        test "$RUNNER_OS" = Linux
        test "$NDDEV_PUBLIC" = true
        python3 - <<'PY'
        import os
        from pathlib import Path
        root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
        assert all((root / '.clusterfuzzlite' / name).is_file() for name in ('Dockerfile', 'build.sh', 'project.yaml'))
        assert os.environ['NDDEV_PHASE'] in {'all', 'build', 'run'}
        assert os.environ['NDDEV_SANITIZER'] in {'address', 'undefined', 'memory'}
        assert os.environ['NDDEV_SECONDS'].isdigit() and 1 <= int(os.environ['NDDEV_SECONDS']) <= 600
        if os.environ['NDDEV_PHASE'] != 'run':
            assert not (root / 'build-out').exists(), 'Never adopt an earlier native build'
        PY
    - name: Build and validate every selected native target
      if: ${{ inputs.phase != 'run' }}
      uses: google/clusterfuzzlite/actions/build_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c
      with:
        language: c++
        project-src-path: .
        sanitizer: ${{ inputs.sanitizer }}
        github-token: ${{ github.token }}
        dry-run: false
        bad-build-check: true
        allowed-broken-targets-percentage: '0'
        keep-unaffected-fuzz-targets: true
        upload-build: false
    - name: Execute native batch fuzzing and retain SDK crash diagnostics
      if: ${{ inputs.phase != 'build' }}
      uses: google/clusterfuzzlite/actions/run_fuzzers@52ecc61cb587ee99c26825a112a21abf19c7448c
      with:
        language: c++
        sanitizer: ${{ inputs.sanitizer }}
        github-token: ${{ github.token }}
        fuzz-seconds: ${{ inputs.seconds }}
        mode: batch
        dry-run: false
        parallel-fuzzing: false
        report-timeouts: true
        report-ooms: true
        output-sarif: false
