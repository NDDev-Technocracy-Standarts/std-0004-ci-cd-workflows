name: Observe current main validation
description: Reconcile native validation presence and optionally dispatch the same full main workflow.
inputs:
  workflow:
    description: Exact caller full-main validation workflow path with workflow_dispatch support
    required: true
  dispatch-missing:
    description: Explicitly allow one native dispatch when no matching run exists
    default: 'false'
  grace-seconds:
    description: Allow the ordinary push trigger time to appear before dispatch
    default: '90'
outputs:
  observation:
    description: Metadata observation; dispatched does not mean validation passed
    value: ${{ steps.observe.outputs.observation }}
runs:
  using: composite
  steps:
    - id: observe
      shell: bash
      env:
        NDDEV_ACTION_PATH: ${{ github.action_path }}
        NDDEV_MAIN_WORKFLOW: ${{ inputs.workflow }}
        NDDEV_MAIN_DISPATCH: ${{ inputs.dispatch-missing }}
        NDDEV_MAIN_GRACE: ${{ inputs.grace-seconds }}
      run: |
        set -euo pipefail
        options=()
        case "$NDDEV_MAIN_DISPATCH" in
          true) options+=(--dispatch) ;;
          false) ;;
          *) echo 'dispatch-missing requires true or false' >&2; exit 2 ;;
        esac
        library="$(cd "$NDDEV_ACTION_PATH/../../.." && pwd)"
        library_uv="$(bash "$library/scripts/library-uv.sh")"
        export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/nddev-main-validation-runtime"
        if [[ -z "${NDDEV_CACHE_PROVIDER:-}" ]]; then
          export UV_CACHE_DIR="${NDDEV_UV_CACHE_ROOT:-$RUNNER_TEMP/nddev-downloads}"
        fi
        observation="$("$library_uv" run --project "$library" --locked --no-dev --python 3.13 \
          python -m nddev_cicd ensure-main --repository "$GITHUB_REPOSITORY" --workflow "$NDDEV_MAIN_WORKFLOW" \
          --grace-seconds "$NDDEV_MAIN_GRACE" "${options[@]}")"
        printf 'observation=%s\n' "$observation" >> "$GITHUB_OUTPUT"
        printf '%s\n' "$observation"
