name: Native benchmark history and comparison
description: Use native SDK formats with an immutable accepted baseline and explicit project regression budget
inputs:
  tool:
    description: Native github-action-benchmark format, such as cargo, go, benchmarkjs, pytest or googlecpp
    required: true
  measurement-file:
    description: Existing native measurement file inside the caller workspace or job temporary directory
    required: true
  history-file:
    description: Accepted native SDK history for compare mode; record mode starts a new baseline
    default: ''
  mode:
    description: compare checks an accepted source baseline; record collects the initial baseline
    default: compare
  maximum-ratio:
    description: Explicit positive finite project regression ratio
    required: true
outputs:
  history:
    description: Next native history, emitted only after successful collection or comparison
    value: ${{ steps.accept.outputs.history }}
runs:
  using: composite
  steps:
    - id: prepare
      name: Validate native inputs without modifying the accepted baseline
      shell: bash
      env:
        NDDEV_ACTION_PATH: ${{ github.action_path }}
        NDDEV_MEASUREMENT: ${{ inputs.measurement-file }}
        NDDEV_HISTORY: ${{ inputs.history-file }}
        NDDEV_TOOL: ${{ inputs.tool }}
        NDDEV_MODE: ${{ inputs.mode }}
        NDDEV_RATIO: ${{ inputs.maximum-ratio }}
        UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/nddev-benchmark-runtime
        UV_CACHE_DIR: ${{ runner.temp }}/nddev-benchmark-downloads
      run: |
        set -euo pipefail
        library="$(cd "$NDDEV_ACTION_PATH/../../.." && pwd)"
        library_uv="$(bash "$library/scripts/library-uv.sh")"
        printf 'library=%s\nuv=%s\n' "$library" "$library_uv" >> "$GITHUB_OUTPUT"
        "$library_uv" run --project "$library" --locked --no-dev --python 3.13 python -c \
          'import os; from pathlib import Path; from nddev_cicd.reports import benchmark_prepare; result=benchmark_prepare(Path(os.environ["GITHUB_WORKSPACE"]),Path(os.environ["RUNNER_TEMP"]),os.environ["NDDEV_MEASUREMENT"],os.environ["NDDEV_HISTORY"],os.environ["NDDEV_TOOL"],os.environ["NDDEV_MODE"],float(os.environ["NDDEV_RATIO"]),os.environ["GITHUB_SERVER_URL"]+"/"+os.environ["GITHUB_REPOSITORY"]); output=open(os.environ["GITHUB_OUTPUT"],"a"); output.write("".join(key+"="+value+"\n" for key,value in result.items())); output.close()'
    - id: native
      name: Run the pinned native format extractor and regression comparator
      uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
      with:
        name: Benchmark
        tool: ${{ inputs.tool }}
        output-file-path: ${{ steps.prepare.outputs.measurement }}
        external-data-json-path: ${{ steps.prepare.outputs.history }}
        alert-threshold: ${{ steps.prepare.outputs.threshold }}
        fail-threshold: ${{ steps.prepare.outputs.threshold }}
        fail-on-alert: ${{ inputs.mode == 'compare' }}
        auto-push: false
        comment-always: false
        comment-on-alert: false
        github-token: ''
        max-items-in-chart: '2'
    - id: accept
      name: Reject empty, incomparable or skipped comparisons before selecting the next history
      if: ${{ steps.native.outcome == 'success' }}
      shell: bash
      env:
        NDDEV_LIBRARY: ${{ steps.prepare.outputs.library }}
        NDDEV_UV: ${{ steps.prepare.outputs.uv }}
        NDDEV_NEXT_HISTORY: ${{ steps.prepare.outputs.history }}
        NDDEV_MODE: ${{ inputs.mode }}
        NDDEV_TOOL: ${{ inputs.tool }}
        UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/nddev-benchmark-runtime
        UV_CACHE_DIR: ${{ runner.temp }}/nddev-benchmark-downloads
      run: |
        set -euo pipefail
        "$NDDEV_UV" run --project "$NDDEV_LIBRARY" --locked --no-dev --python 3.13 python -c \
          'import os; from pathlib import Path; from nddev_cicd.reports import benchmark_history; benchmark_history(Path(os.environ["NDDEV_NEXT_HISTORY"]),os.environ["NDDEV_TOOL"],os.environ["GITHUB_SERVER_URL"]+"/"+os.environ["GITHUB_REPOSITORY"],comparison=os.environ["NDDEV_MODE"]=="compare"); output=open(os.environ["GITHUB_OUTPUT"],"a"); output.write("history="+os.environ["NDDEV_NEXT_HISTORY"]+"\n"); output.close()'
