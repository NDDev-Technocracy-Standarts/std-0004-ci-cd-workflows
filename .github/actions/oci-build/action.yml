name: Build a native OCI artifact
description: Build an actual OCI archive without registry publication; preserve source and compiler identities
inputs:
  working-directory:
    default: .
  context:
    default: .
  dockerfile:
    default: Dockerfile
  output:
    default: dist/image.oci.tar
  platforms:
    default: linux/amd64
  builder:
    description: Optional existing caller-owned bounded Buildx builder; otherwise a disposable builder is used
    default: ''
  build-args:
    description: Newline-separated non-secret KEY=value build arguments
    default: ''
  cache-from:
    description: Newline-separated explicit native local/registry/GHA v2 cache imports
    default: ''
  cache-to:
    description: Newline-separated owner-admitted cache exports; GitHub PRs cannot write caches
    default: ''
  cache-budget-bytes:
    description: Explicit total byte budget required for dedicated local cache exports
    default: '0'
outputs:
  archive:
    description: Actual OCI archive inside the caller workspace
    value: ${{ steps.build.outputs.archive }}
  metadata:
    description: Source/digest/compiler binding to retain with the archive
    value: ${{ steps.build.outputs.metadata }}
runs:
  using: composite
  steps:
    - name: Expose the caller's native cache runtime without logging credentials
      if: ${{ contains(inputs.cache-from, 'type=gha') || contains(inputs.cache-to, 'type=gha') }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
            const value = process.env[name];
            if (!value) throw new Error('Native GHA v2 cache runtime is unavailable');
            if (name === 'ACTIONS_RUNTIME_TOKEN') core.setSecret(value);
            core.exportVariable(name, value);
          }
    - id: build
      shell: bash
      env:
        NDDEV_ACTION_PATH: ${{ github.action_path }}
        NDDEV_LIBRARY_REPOSITORY: ${{ github.action_repository }}
        NDDEV_LIBRARY_REF: ${{ github.action_ref }}
        NDDEV_DIRECTORY: ${{ inputs.working-directory }}
        NDDEV_CONTEXT: ${{ inputs.context }}
        NDDEV_DOCKERFILE: ${{ inputs.dockerfile }}
        NDDEV_OCI_OUTPUT: ${{ inputs.output }}
        NDDEV_PLATFORMS: ${{ inputs.platforms }}
        NDDEV_BUILDER: ${{ inputs.builder }}
        NDDEV_BUILD_ARGS: ${{ inputs.build-args }}
        NDDEV_CACHE_FROM: ${{ inputs.cache-from }}
        NDDEV_CACHE_TO: ${{ inputs.cache-to }}
        NDDEV_CACHE_BUDGET: ${{ inputs.cache-budget-bytes }}
        UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/nddev-oci-runtime
      run: |
        set -euo pipefail
        library="$(cd "$NDDEV_ACTION_PATH/../../.." && pwd)"
        library_uv="$(bash "$library/scripts/library-uv.sh")"
        project="$("$library_uv" run --project "$library" --locked --no-dev --python 3.13 python -c \
          'import os; from pathlib import Path; from nddev_cicd.model import contained; print(contained(Path(os.environ["GITHUB_WORKSPACE"]),os.environ["NDDEV_DIRECTORY"],exists=True))')"
        builder=()
        if [ -n "$NDDEV_BUILDER" ]; then builder=(--builder "$NDDEV_BUILDER"); fi
        while IFS= read -r value; do if [ -n "$value" ]; then builder+=(--build-arg "$value"); fi; done <<< "$NDDEV_BUILD_ARGS"
        while IFS= read -r value; do if [ -n "$value" ]; then builder+=(--cache-from "$value"); fi; done <<< "$NDDEV_CACHE_FROM"
        while IFS= read -r value; do if [ -n "$value" ]; then builder+=(--cache-to "$value"); fi; done <<< "$NDDEV_CACHE_TO"
        "$library_uv" run --project "$library" --locked --no-dev --python 3.13 python -m nddev_cicd oci-build \
          --root "$project" --context "$NDDEV_CONTEXT" --dockerfile "$NDDEV_DOCKERFILE" \
          --output "$NDDEV_OCI_OUTPUT" --platforms "$NDDEV_PLATFORMS" --cache-budget-bytes "$NDDEV_CACHE_BUDGET" "${builder[@]}"
        echo "archive=$project/$NDDEV_OCI_OUTPUT" >> "$GITHUB_OUTPUT"
        echo "metadata=$project/${NDDEV_OCI_OUTPUT%.*}.json" >> "$GITHUB_OUTPUT"
