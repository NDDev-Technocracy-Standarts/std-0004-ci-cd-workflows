name: Prepare native Trivy databases
description: Reuse a fresh per-host database snapshot; analysis caches and scanner results stay job-owned.
inputs:
  image:
    description: Exact digest-pinned Trivy image selected by the consumer
    required: true
  java:
    description: Also prepare the Java index database for scans that can contain JARs
    default: 'false'
  budget-bytes:
    default: '4294967296'
  reserve-bytes:
    default: '1073741824'
outputs:
  cache-dir:
    description: Prepared job-local cache; use skip-db-update only after this action succeeds
    value: ${{ steps.prepare.outputs.cache_dir }}
runs:
  using: composite
  steps:
    - id: prepare
      shell: bash
      env:
        NDDEV_ACTION_PATH: ${{ github.action_path }}
        NDDEV_TRIVY_IMAGE: ${{ inputs.image }}
        NDDEV_TRIVY_JAVA: ${{ inputs.java }}
        NDDEV_TRIVY_BUDGET: ${{ inputs.budget-bytes }}
        NDDEV_TRIVY_RESERVE: ${{ inputs.reserve-bytes }}
      run: |
        set -euo pipefail
        library="$(cd "$NDDEV_ACTION_PATH/../../.." && pwd)"
        library_uv="$(bash "$library/scripts/library-uv.sh")"
        export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/nddev-trivy-runtime"
        export UV_CACHE_DIR="${NDDEV_UV_CACHE_ROOT:-$RUNNER_TEMP/nddev-downloads}"
        java=()
        case "$NDDEV_TRIVY_JAVA" in
          true) java=(--java) ;;
          false) ;;
          *) echo 'java must be true or false' >&2; exit 2 ;;
        esac
        storage="${NDDEV_TRIVY_CACHE_ROOT:-$RUNNER_TEMP/nddev-trivy-databases}"
        "$library_uv" run --project "$library" --locked --no-dev --python 3.13 python -m nddev_cicd trivy-db \
          --storage "$storage" --destination "$RUNNER_TEMP/trivy-cache" --image "$NDDEV_TRIVY_IMAGE" \
          --budget "$NDDEV_TRIVY_BUDGET" --reserve "$NDDEV_TRIVY_RESERVE" "${java[@]}"
        printf 'cache_dir=%s\n' "$RUNNER_TEMP/trivy-cache" >> "$GITHUB_OUTPUT"
