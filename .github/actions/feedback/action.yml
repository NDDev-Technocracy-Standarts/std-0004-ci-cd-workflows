name: Publish native failure feedback
description: Read bounded run metadata and deduplicate failure Issues without executing candidate code.
inputs:
  workflows:
    description: JSON array of exact allowed workflow paths
    required: true
  creators:
    description: JSON array of allowed native run actors
    required: true
  run-id:
    description: Exact completed run, or empty for bounded reconciliation
    default: ''
  task-issue:
    description: Existing owning Issue for deduplicated comments, or empty to create a failure Issue
    default: ''
  conclusions:
    default: '["failure","timed_out","action_required","startup_failure"]'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        NDDEV_ACTION_PATH: ${{ github.action_path }}
        NDDEV_WORKFLOWS: ${{ inputs.workflows }}
        NDDEV_CREATORS: ${{ inputs.creators }}
        NDDEV_FEEDBACK_RUN: ${{ inputs.run-id }}
        NDDEV_TASK_ISSUE: ${{ inputs.task-issue }}
        NDDEV_CONCLUSIONS: ${{ inputs.conclusions }}
      run: |
        set -euo pipefail
        library="$(cd "$NDDEV_ACTION_PATH/../../.." && pwd)"
        library_uv="$(bash "$library/scripts/library-uv.sh")"
        export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/nddev-feedback-runtime"
        export UV_CACHE_DIR="$RUNNER_TEMP/nddev-downloads"
        selection=()
        if [[ -n "$NDDEV_FEEDBACK_RUN" ]]; then selection+=(--run-id "$NDDEV_FEEDBACK_RUN"); fi
        if [[ -n "$NDDEV_TASK_ISSUE" ]]; then selection+=(--task-issue "$NDDEV_TASK_ISSUE"); fi
        "$library_uv" run --project "$library" --locked --no-dev --python 3.13 python -m nddev_cicd feedback \
          --workflows "$NDDEV_WORKFLOWS" --creators "$NDDEV_CREATORS" --conclusions "$NDDEV_CONCLUSIONS" "${selection[@]}"
