name: Native source CI
description: Execute the caller's selected native profile contract with an isolated pinned library runtime.
inputs:
  working-directory:
    description: Existing caller project directory inside the workspace
    default: .
  contract:
    description: Contained caller TOML path
    default: .github/nddev-ci.toml
  result-key:
    description: Unique job identity; primary owns the deployable bundle
    default: primary
  upload:
    description: Result upload policy (always, failure or never); delivery requires always
    default: always
  retention-days:
    description: Result retention in days (1..3)
    default: '3'
  python:
    description: Actual caller Python major.minor (library runtime is independent)
    default: '3.13'
outputs:
  status:
    description: Set to success only after complete native validation
    value: ${{ steps.native.outputs.status }}
  result-directory:
    description: Job-local result and selected artifact directory
    value: ${{ steps.native.outputs.directory }}
  artifact-id:
    description: Immutable native uploaded artifact ID; empty when no artifact was uploaded
    value: ${{ steps.upload.outputs.artifact-id }}
  artifact-digest:
    description: Native upload archive digest
    value: ${{ steps.upload.outputs.artifact-digest }}
  producer-attempt:
    description: Native attempt that executed this source job; retained needs outputs preserve it
    value: ${{ github.run_attempt }}
runs:
  using: composite
  steps:
    - name: Run selected native checks
      id: native
      shell: bash
      env:
        NDDEV_ACTION_PATH: ${{ github.action_path }}
        NDDEV_LIBRARY_REPOSITORY: ${{ github.action_repository }}
        NDDEV_LIBRARY_REF: ${{ github.action_ref }}
        NDDEV_CONTRACT: ${{ inputs.contract }}
        NDDEV_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        NDDEV_RESULT_KEY: ${{ inputs.result-key }}
        NDDEV_UPLOAD: ${{ inputs.upload }}
        NDDEV_RETENTION: ${{ inputs.retention-days }}
        NDDEV_SOURCE_CHECK_RUN_ID: ${{ job.check_run_id }}
        UV_PYTHON: ${{ inputs.python }}
      run: |
        set -euo pipefail
        [[ "$NDDEV_RESULT_KEY" =~ ^[A-Za-z0-9_-]{1,64}$ ]]
        case "$NDDEV_UPLOAD" in always|failure|never) ;; *) echo 'Invalid upload policy' >&2; exit 2 ;; esac
        [[ "$NDDEV_RETENTION" =~ ^[1-3]$ ]]
        library="$(cd "$NDDEV_ACTION_PATH/../../.." && pwd)"
        library_uv="$(bash "$library/scripts/library-uv.sh")"
        export GIT_CONFIG_GLOBAL="$(mktemp "$RUNNER_TEMP/nddev-git-config.XXXXXXXX")"
        export NDDEV_LIBRARY_REPOSITORY="${NDDEV_LIBRARY_REPOSITORY:-$GITHUB_REPOSITORY}"
        export NDDEV_LIBRARY_REF="${NDDEV_LIBRARY_REF:-$(git -C "$library" rev-parse HEAD)}"
        export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/nddev-library-runtime"
        export UV_CACHE_DIR="${NDDEV_UV_CACHE_ROOT:-$RUNNER_TEMP/nddev-downloads}"
        project_root="$("$library_uv" run --project "$library" --locked --no-dev --python 3.13 python -c \
          'import os; from pathlib import Path; from nddev_cicd.model import contained; print(contained(Path(os.environ["GITHUB_WORKSPACE"]),os.environ["NDDEV_WORKING_DIRECTORY"],exists=True))')"
        directory="$RUNNER_TEMP/nddev-source-$NDDEV_RESULT_KEY"
        echo "directory=$directory" >> "$GITHUB_OUTPUT"
        "$library_uv" run --project "$library" --locked --no-dev --python 3.13 python -m nddev_cicd ci \
          --root "$project_root" --contract "$NDDEV_CONTRACT" --output "$directory"
        echo "status=success" >> "$GITHUB_OUTPUT"
    - name: Retain native results and selected deployable files
      id: upload
      if: ${{ !cancelled() && steps.native.outputs.directory != '' && (inputs.upload == 'always' || (inputs.upload == 'failure' && steps.native.outcome == 'failure')) }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: nddev-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.result-key }}
        path: ${{ steps.native.outputs.directory }}
        if-no-files-found: error
        retention-days: ${{ inputs.retention-days }}
        compression-level: 6
