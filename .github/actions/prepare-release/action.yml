name: Prepare an eligible release candidate
description: Preserve checked native payload bytes, generate native SPDX inventory and package a candidate without publishing a tag
inputs:
  run-id:
    description: Exact successful integrated PR source run
    required: true
  source-workflow:
    default: .github/workflows/main-ci.yml
  files:
    description: JSON list of native artifact paths inside the verified source bundle
    default: '["dist/*.whl","dist/*.tar.gz"]'
outputs:
  directory:
    value: ${{ steps.prepare.outputs.directory }}
    description: Owned job-local candidate and supporting metadata directory
  candidate:
    value: ${{ steps.prepare.outputs.candidate }}
    description: Candidate tar preserving payload modes and metadata closure
  sbom:
    value: ${{ steps.prepare.outputs.sbom }}
    description: Native Syft SPDX inventory of the selected release payloads
runs:
  using: composite
  steps:
    - name: Prepare the native SPDX tool from its verified upstream archive
      shell: bash
      env:
        NDDEV_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        library="$(cd "$NDDEV_ACTION_PATH/../../.." && pwd)"
        library_uv="$(bash "$library/scripts/library-uv.sh")"
        "$library/scripts/prepare-release-tools.sh"
    - name: Bind the source and prepare exact native release contents
      id: prepare
      shell: bash
      env:
        NDDEV_ACTION_PATH: ${{ github.action_path }}
        NDDEV_LIBRARY_REPOSITORY: ${{ github.action_repository }}
        NDDEV_LIBRARY_REF: ${{ github.action_ref }}
        NDDEV_SOURCE_RUN: ${{ inputs.run-id }}
        NDDEV_SOURCE_WORKFLOW: ${{ inputs.source-workflow }}
        NDDEV_RELEASE_FILES: ${{ inputs.files }}
        UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/nddev-release-runtime
      run: |
        set -euo pipefail
        if [[ -z "${NDDEV_CACHE_PROVIDER:-}" ]]; then
          export UV_CACHE_DIR="${NDDEV_UV_CACHE_ROOT:-$RUNNER_TEMP/nddev-downloads}"
        fi
        library="$(cd "$NDDEV_ACTION_PATH/../../.." && pwd)"
        library_uv="$(bash "$library/scripts/library-uv.sh")"
        directory="$RUNNER_TEMP/nddev-release-candidate"
        "$library_uv" run --project "$library" --locked --no-dev --python 3.13 python -m nddev_cicd prepare-release \
          --run-id "$NDDEV_SOURCE_RUN" --workflow "$NDDEV_SOURCE_WORKFLOW" \
          --download "$RUNNER_TEMP/nddev-release-input" --directory "$directory" --files "$NDDEV_RELEASE_FILES"
        echo "directory=$directory" >> "$GITHUB_OUTPUT"
        echo "candidate=$directory/candidate.tar.gz" >> "$GITHUB_OUTPUT"
        echo "sbom=$directory/sbom.spdx.json" >> "$GITHUB_OUTPUT"
