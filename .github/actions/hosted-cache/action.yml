name: Hosted dependency cache
description: Restore lockfile-keyed native caches on GitHub-hosted runners; save only from default-branch pushes.
inputs:
  ecosystems:
    description: Space/comma-separated cargo, bun, npm, pub or go; cache uv through astral-sh/setup-uv
    required: true
  working-directory:
    description: Contained project directory holding the selected lockfiles; cargo uses its Cargo.lock here
    default: .
  save:
    description: auto saves only on push or workflow_dispatch to the default branch; never always restores only
    default: auto
  key:
    description: Optional profile (letters, digits, _) separating jobs that build differently, such as clippy and tests or Go -race; empty shares one entry per directory
    default: ''
outputs:
  enabled:
    description: true on GitHub-hosted runners; false on self-hosted runners, which keep their owned caches
    value: ${{ steps.plan.outputs.enabled }}
  save:
    description: true when this job may save the cache
    value: ${{ steps.plan.outputs.save }}
  cache-hit:
    description: Exact package-cache key match for non-Cargo ecosystems
    value: ${{ steps.save.outputs.cache-hit || steps.restore.outputs.cache-hit }}
  cargo-hit:
    description: Cargo cache restore result reported by rust-cache
    value: ${{ steps.cargo.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Plan lockfile-keyed caches
      id: plan
      shell: bash
      env:
        NDDEV_ACTION_PATH: ${{ github.action_path }}
        NDDEV_ECOSYSTEMS: ${{ inputs.ecosystems }}
        NDDEV_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        NDDEV_SAVE: ${{ inputs.save }}
        NDDEV_KEY: ${{ inputs.key }}
        NDDEV_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        NDDEV_EVENT: ${{ github.event_name }}
        NDDEV_REF: ${{ github.ref }}
        NDDEV_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        library="$(cd "$NDDEV_ACTION_PATH/../../.." && pwd)"
        python="$(command -v python3 || command -v python)"
        "$python" "$library/scripts/hosted-cache.py"
    - name: Restore Cargo registry and dependency builds
      id: cargo
      if: ${{ steps.plan.outputs.cargo == 'true' }}
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: ${{ steps.plan.outputs.cargo-workspaces }}
        shared-key: ${{ steps.plan.outputs.cargo-key }}
        save-if: ${{ steps.plan.outputs.save }}
        cache-bin: 'false'
    - name: Restore and save package caches
      id: save
      if: ${{ steps.plan.outputs.files == 'true' && steps.plan.outputs.save == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.plan.outputs.paths }}
        key: ${{ steps.plan.outputs.key }}
        restore-keys: ${{ steps.plan.outputs.restore-keys }}
    - name: Restore package caches
      id: restore
      if: ${{ steps.plan.outputs.files == 'true' && steps.plan.outputs.save != 'true' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.plan.outputs.paths }}
        key: ${{ steps.plan.outputs.key }}
        restore-keys: ${{ steps.plan.outputs.restore-keys }}
