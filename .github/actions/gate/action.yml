name: Require expected native jobs
description: Evaluate leaf results once; unexpected skips, failures and missing dependencies fail closed.
inputs:
  needs:
    description: Native toJSON(needs) object from the caller's final job
    required: true
  expected:
    description: Explicit JSON job map; affected jobs need success, non-applicable jobs need skipped
    required: true
  scopes:
    description: Optional raw true/false classifier outputs; missing or malformed selection cannot become an unaffected job
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        NDDEV_ACTION_PATH: ${{ github.action_path }}
        NDDEV_GATE_NEEDS: ${{ inputs.needs }}
        NDDEV_GATE_EXPECTED: ${{ inputs.expected }}
        NDDEV_GATE_SCOPES: ${{ inputs.scopes }}
      run: |
        set -euo pipefail
        library="$(cd "$NDDEV_ACTION_PATH/../../.." && pwd)"
        library_uv="$(bash "$library/scripts/library-uv.sh")"
        export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/nddev-gate-runtime"
        export UV_CACHE_DIR="${NDDEV_UV_CACHE_ROOT:-$RUNNER_TEMP/nddev-downloads}"
        selection=()
        if [[ -n "$NDDEV_GATE_SCOPES" ]]; then selection+=(--scopes "$NDDEV_GATE_SCOPES"); fi
        "$library_uv" run --project "$library" --locked --no-dev --python 3.13 python -m nddev_cicd gate \
          --needs "$NDDEV_GATE_NEEDS" --expected "$NDDEV_GATE_EXPECTED" "${selection[@]}"
