name: Prepare native Linux tools
description: Install verified binaries into the owned job temporary directory without shared-host packages.
inputs:
  capability:
    description: Empty for workflow/docs tools, rust for Cargo policy/cache tools, security for Gitleaks
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        NDDEV_ACTION_PATH: ${{ github.action_path }}
        NDDEV_TOOL_CAPABILITY: ${{ inputs.capability }}
      run: |
        set -euo pipefail
        case "$NDDEV_TOOL_CAPABILITY" in ''|rust|security) ;; *) exit 2 ;; esac
        library="$(cd "$NDDEV_ACTION_PATH/../../.." && pwd)"
        "$library/scripts/prepare-linux-tools.sh" "$NDDEV_TOOL_CAPABILITY"
