name: Native exact Rust setup
description: Reuse installed Rust components offline and install only missing exact SDK inputs.
inputs:
  toolchain:
    description: Exact Rust release or dated nightly; floating channels are refused
    required: true
  components:
    description: Space/comma-separated native components
    default: clippy,rustfmt
  targets:
    description: Space/comma-separated native target triples
    default: ''
  install-missing:
    description: Allow bounded native installation of missing SDK inputs
    default: 'true'
  shared-downloads:
    description: Opt into the host-provided Cargo download cache; keep targets and auxiliary tool state separate
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        NDDEV_ACTION_PATH: ${{ github.action_path }}
        NDDEV_RUST_TOOLCHAIN: ${{ inputs.toolchain }}
        NDDEV_RUST_COMPONENTS: ${{ inputs.components }}
        NDDEV_RUST_TARGETS: ${{ inputs.targets }}
        NDDEV_RUST_INSTALL: ${{ inputs.install-missing }}
        NDDEV_RUST_SHARED_DOWNLOADS: ${{ inputs.shared-downloads }}
      run: |
        set -euo pipefail
        library="$(cd "$NDDEV_ACTION_PATH/../../.." && pwd)"
        library_uv="$(bash "$library/scripts/library-uv.sh")"
        export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/nddev-rust-setup-runtime"
        export UV_CACHE_DIR="${NDDEV_UV_CACHE_ROOT:-$RUNNER_TEMP/nddev-downloads}"
        options=()
        case "$NDDEV_RUST_INSTALL" in
          true) ;;
          false) options+=(--no-install) ;;
          *) echo 'install-missing requires true or false' >&2; exit 2 ;;
        esac
        case "$NDDEV_RUST_SHARED_DOWNLOADS" in
          true) options+=(--shared-downloads) ;;
          false) ;;
          *) echo 'shared-downloads requires true or false' >&2; exit 2 ;;
        esac
        read -ra components <<< "${NDDEV_RUST_COMPONENTS//,/ }"
        read -ra targets <<< "${NDDEV_RUST_TARGETS//,/ }"
        "$library_uv" run --project "$library" --locked --no-dev --python 3.13 python -m nddev_cicd rust-setup \
          --toolchain "$NDDEV_RUST_TOOLCHAIN" --components "${components[@]}" --targets "${targets[@]}" \
          --github-environment "${options[@]}"
