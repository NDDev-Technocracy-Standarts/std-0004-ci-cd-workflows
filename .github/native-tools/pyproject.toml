[project]
name="native-sdk-provisioning"
version="0.1.0"
requires-python=">=3.11"
dependencies=["aqtinstall==3.3.0"]
[dependency-groups]
quality=["semgrep==1.181.0", "mutmut==3.8.0", "coverage==7.16.2", "pytest>=9,<10"]
[tool.uv]
package=false
# Semgrep pins the vulnerable MCP SDK; retain the compatible patched 1.x API.
# Keep the telemetry family coherent: older exporters use a private API removed by the patched API.
# Real offline Semgrep fixtures and the owned-lock scan qualify this native tool composition.
override-dependencies=[
    "mcp==1.30.0",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation-requests==0.66b1",
    "opentelemetry-instrumentation-threading==0.66b1",
]
