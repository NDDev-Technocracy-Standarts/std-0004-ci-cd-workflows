schema=1
profiles=["workflows"]

[impact]
baseline_workflow=".github/workflows/main-ci.yml"
shared=[".github/**","scripts/**","tests/test_*.py","tests/conftest.py","tests/run_native.py","tests/native_tools_acceptance.py"]

[impact.components.runtime]
paths=["src/**","pyproject.toml","uv.lock","tests/native_*.py","tests/*_fixture.py"]
profiles=["python"]

[impact.components.documentation]
paths=["README.md","AGENTS.md","LICENSE","NOTICE","docs/**","spec/**","generated/**","standard.yml","examples/**",".agents/**"]
profiles=["documentation"]

[impact.components.fixture-advanced]
paths=["tests/native/advanced/**"]
profiles=["documentation"]
depends_on=["runtime"]

