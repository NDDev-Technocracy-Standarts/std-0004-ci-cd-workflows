schema=1
profiles=["workflows"]

[impact]
baseline_workflow=".github/workflows/main-ci.yml"
shared=[".github/**","scripts/**","tests/test_*.py","tests/conftest.py","tests/run_native.py","tests/native_tools_acceptance.py"]

[impact.components.runtime]
paths=["src/**","pyproject.toml","uv.lock","tests/native_*.py","tests/*_fixture.py"]
profiles=["python"]

[impact.components.documentation]
paths=["README.md","AGENTS.md","LICENSE","NOTICE","docs/**","spec/**","generated/**","standard.yml","examples/**",".agents/**"]
profiles=["documentation"]

[impact.components.fixture-advanced]
paths=["tests/native/advanced/**"]
profiles=["advanced-testing"]
depends_on=["runtime"]

[impact.components.fixture-alembic]
paths=["tests/native/alembic/**"]
profiles=["sql-data"]
depends_on=["runtime"]

[impact.components.fixture-android]
paths=["tests/native/android/**"]
profiles=["android-kotlin"]
depends_on=["runtime"]

[impact.components.fixture-architecture]
paths=["tests/native/architecture/**"]
profiles=["architecture"]
depends_on=["runtime"]

[impact.components.fixture-bun]
paths=["tests/native/bun/**"]
profiles=["web"]
depends_on=["runtime"]

[impact.components.fixture-container]
paths=["tests/native/container/**"]
profiles=["container"]
depends_on=["runtime"]

[impact.components.fixture-cpp]
paths=["tests/native/cpp/**"]
profiles=["c-cpp"]
depends_on=["runtime"]

[impact.components.fixture-dotnet]
paths=["tests/native/dotnet/**"]
profiles=["dotnet"]
depends_on=["runtime"]

[impact.components.fixture-flutter]
