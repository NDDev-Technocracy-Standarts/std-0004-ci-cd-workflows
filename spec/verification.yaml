apiVersion: std-0000.nddev.ai/v1alpha1
kind: VerificationInventory
# Scope is deliberately partial: tests do not decide owner authority, billing guarantees or prose truth.
entries:
- id: runtime.routing
  kind: test
  target: tests/test_readiness.py::test_public_always_uses_standard_github_even_with_blacksmith_admission
  establishes: Public Linux/Windows/macOS refuse provider switching. Private admission/trust and malformed-policy cases run in the core suite; actual account entitlements remain review.
- id: runtime.impact
  kind: test
  target: tests/test_core.py::test_impact_deletion_dependency_and_uncertainty
  establishes: Actual Git deletion/rename, dependents and missing-base cases retain required scopes; additional graph/unknown-path cases run in the same suite.
- id: runtime.reports
  kind: test
  target: tests/test_core.py::test_native_report_collection
  establishes: Native positive collection and missing/empty/all-skipped result rejection. Whole workflow job expectations are additionally checked by its final gate.
- id: runtime.inputs
  kind: test
  target: tests/test_core.py::test_validation_cannot_change_its_locked_inputs
  establishes: Validation cannot silently replace the selected contract/native lock inputs; artifact manifests additionally bind actual source/tree/run/callee identities.
- id: runtime.profiles
  kind: check
  target: tests/run_native.py
  establishes: Selected native fixtures build/test/package real source and reject deliberate errors. This covers the declared finite SDK/OS cells, not every SDK or hardware target.
- id: runtime.gates
  kind: test
  target: tests/test_core.py::test_explicit_external_timeout_remains_unavailable_and_broken_urls_fail
  establishes: Declared native external transport/access limits remain unavailable with Issue references; broken responses remain failures. Findings still need project-specific review.
- id: runtime.architecture
  kind: check
  target: tests/native/architecture/.github/nddev-ci.toml
  establishes: The real Import Linter fixture accepts the correct graph and rejects a forbidden reverse dependency/cycle and an unmatched scope through tests/run_native.py.
- id: runtime.documents
  kind: test
  target: tests/test_core.py::test_docs_real_local_links_and_generation
  establishes: Current local links and canonical generation drift are checked. Executable doctests and Flutter localization generation exercise native examples; prose truth remains review.
- id: runtime.process
  kind: test
  target: tests/test_readiness.py::test_owned_descendant_is_gone_after_leader_exits
  establishes: Real SIGTERM-resistant descendants are terminated after timeout and cancellation even when their leader exits. Core cases also exercise startup failure, exit status and logs.
- id: runtime.cache
  kind: test
  target: tests/test_core.py::test_cache_ownership_actual_lock_and_budget
  establishes: Owned native lock/reclamation scenarios preserve foreign and active data; native Rust fixtures measure target/sccache reuse with bounded stores. Host capacity remains an owner observation.
- id: runtime.retention
  kind: test
  target: tests/test_core.py::test_native_failure_report_is_retained_and_escape_rejected
  establishes: Selected native report bytes are retained after failure while escaping paths are rejected. Native upload jobs retain the bounded actual result artifact.
- id: runtime.lineage
  kind: test
  target: tests/test_core.py::test_github_lineage_rejects_other_tree_and_attempt
  establishes: Native run-binding logic rejects mismatched source trees/attempts. Actual merged-run API/download execution supplements these finite negative cases.
- id: runtime.artifact
  kind: test
  target: tests/test_core.py::test_artifact_bytes_mode_escape_and_tampering
  establishes: Selected artifact bytes, executable modes and content/source identities survive packaging/unpacking; traversal, tampering and unrelated source are rejected.
- id: runtime.delivery
  kind: check
  target: tests/native_delivery.py
  establishes: Native static HTTP, an isolated Compose project, a temporary systemd service, HTTPS package publication with consumer install, and native-validated Android APK/AAB packages exercise the selected adapters. Invalid-operation regressions additionally prove that backup/migration never starts on known invalid input. This is not production/store acceptance.
- id: runtime.target-lock
  kind: test
  target: tests/native_delivery.py::test_real_target_serialization
  establishes: Independent real processes racing one target cannot both replace the same previous state. Stale attempts are rejected by the same target-owned state/lock.
- id: runtime.recovery
  kind: test
  target: tests/native_delivery.py::test_partial_data_migration_preserves_backup_and_never_repeats
  establishes: A real isolated SQLite backup/migration followed by failed health remains pending without incompatible file rollback; recovery verifies the same resource and does not repeat the migration.
- id: runtime.health
  kind: test
  target: tests/native_delivery.py::test_real_compose_immutable_image_and_health
  establishes: Actual native target scenarios expose the tested revision. Compose inspection also checks selected running immutable image identities; generic HTTP success is insufficient.
- id: runtime.remote
  kind: check
  target: tests/native_remote.py
  establishes: Actual SSH/SCP reaches a separate server/filesystem; pinned host-key failure, exact artifact receipts, two-client target exclusion and partial migration recovery are exercised. Production targets and arbitrary server toolchains remain unverified.
- id: runtime.preflight
  kind: test
  target: tests/test_readiness.py::test_invalid_operation_never_starts_backup_or_migration
  establishes: Known invalid service, project, registry and payload inputs invoke neither backup nor migration and leave the target unchanged.
- id: runtime.oci
  kind: check
  target: tests/native_oci.py
  establishes: Native Buildx creates a real OCI archive; strict TLS registry publication preserves its digest, a real running image serves the revision, and corruption/build errors fail. Selected Linux x64 does not establish every platform.
- id: runtime.current
  kind: test
  target: tests/test_readiness.py::test_unowned_current_is_rejected_before_backup_migration_or_release
  establishes: Existing current files/directories are refused before backup, migration, release or pending-state creation and their bytes remain intact. The core static delivery scenario also exercises a successful subsequent activation through the owned current symlink.
- id: runtime.release
  kind: check
  target: tests/native_release.py
  establishes: Native wheel/sdist inventory through Syft preserves selected bytes/modes and rejects tampering; the public workflow separately establishes actual GitHub signatures on an eligible candidate.
- id: runtime.advanced
  kind: check
  target: tests/native_advanced.py
  establishes: Real Rust/C++ fuzz runs, retained crash inputs, caught/missed native mutation outcomes and paired benchmark measurements exercise positive and deliberate failure cases. No application-wide quality or speed claim follows.
- id: runtime.gitlinks
  kind: test
  target: tests/test_git_inputs.py::test_ci_checks_submodule_inputs_before_and_after_commands
  establishes: Real submodule gitlinks/worktrees match, and stale/dirty/symlinked or command-modified inputs cannot pass source validation.
