apiVersion: std-0000.nddev.ai/v1alpha1
kind: SourceRegister
sources:
- key: gha-reuse
  title: 'GitHub: reuse workflow configurations'
  url: https://docs.github.com/en/actions/reference/workflows-and-actions/reusing-workflow-configurations
  supports: Caller context, permission propagation and self-hosted runner visibility constrain reusable
    workflow composition.
  limits: Provider limits and access rules are version-sensitive. This is not proof of a specific cross-organization
    installation.
- key: dependabot-options
  title: 'GitHub: Dependabot options reference'
  url: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
  supports: Scheduled version updates for GitHub Actions and package ecosystems, grouping, and a cooldown
    that delays proposals for newly published releases.
  limits: An update proposal is not a reviewed or tested change, and an absent proposal does not prove
    that a pinned source is current or still maintained.
- key: gha-composite
  title: 'GitHub: composite actions'
  url: https://docs.github.com/en/actions/tutorials/create-actions/create-a-composite-action
  supports: Shared steps execute inside a caller-owned job.
  limits: A composite action does not select a job runner or safely hide arbitrary untrusted commands.
- key: gha-events
  title: 'GitHub: workflow events'
  url: https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows
  supports: PR contexts, merge refs and downstream event semantics differ.
  limits: An event or successful old run alone does not prove the integrated artifact is eligible.
- key: gha-billing
  title: 'GitHub: Actions billing'
  url: https://docs.github.com/en/billing/concepts/product-billing/github-actions
  supports: Standard public hosted execution and self-hosted execution have distinct billing from private
    hosted use and storage.
  limits: Actual allowance, budgets and account policy must be observed; no fixed number is a perpetual
    standard guarantee.
- key: gha-secrets
  title: 'GitHub: Actions secrets'
  url: https://docs.github.com/en/actions/how-tos/write-workflows/choose-what-workflows-do/use-secrets
  supports: Repository-scoped secrets, fork restrictions and private-Free organization-secret limitations.
  limits: Access does not authorize a deployment; masking is not complete data-loss prevention.
- key: gha-security
  title: 'GitHub: secure use of Actions'
  url: https://docs.github.com/en/actions/reference/security/secure-use
  supports: Privileged event, untrusted code, token and persistent self-hosted runner trust boundaries.
  limits: The implementation needs appropriate concrete controls, not a claim that every container is
    isolated.
- key: gha-concurrency
  title: 'GitHub: workflow concurrency'
  url: https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
  supports: Concurrency groups and cancellation are repository-scoped coordination mechanisms.
  limits: A deployment-attempt key does not serialize one target; no cross-repository lock is implied.
- key: gha-hosted-runners
  title: 'GitHub: GitHub-hosted runners reference'
  url: https://docs.github.com/en/actions/reference/runners/github-hosted-runners
  supports: The labels GitHub lists as standard GitHub-hosted runners for public repositories, with their
    images and specifications, including ubuntu-26.04, ubuntu-26.04-arm, windows-2025, macos-15 and macos-26.
  limits: The label set and specifications change with GitHub's image lifecycle. Read the table when a label
    is selected.
- key: gha-larger-runners
  title: 'GitHub: larger runners'
  url: https://docs.github.com/en/actions/concepts/runners/larger-runners
  supports: Larger runners are billed at the per-minute rate, including usage in public repositories.
  limits: Availability and labels depend on plan and organization configuration.
- key: gha-limits
  title: 'GitHub: Actions limits'
  url: https://docs.github.com/en/actions/reference/limits
  supports: Concurrency per plan for standard hosted runners (GitHub Free 20 jobs, 5 of them macOS), the
    6-hour hosted job limit and storage allowances.
  limits: Numbers are plan- and time-dependent; they are not a perpetual guarantee.
- key: gha-dependency-caching
  title: 'GitHub: dependency caching reference'
  url: https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching
  supports: Default 10 GB cache limit per repository with billing beyond it, eviction of entries unused for
    7 days, eviction under pressure and branch-scoped restore rules.
  limits: The limit can be raised by administrators at a cost. Restore scoping does not by itself bound
    pull-request writes.
- key: runner-images
  title: 'actions/runner-images: available images and announcements'
  url: https://github.com/actions/runner-images
  supports: Current image labels, `-latest` migrations (ubuntu-latest to Ubuntu 26.04 by 2026-11-19) and
    retirements with scheduled brownouts (macOS 14 unsupported from 2026-11-02).
  limits: Announcements are time-bound; dates must be read from the current notice.
- key: gha-artifacts
  title: 'GitHub: upload-artifact'
  url: https://github.com/actions/upload-artifact
  supports: Artifact packaging, permission behavior, compression and retention options.
  limits: Action version and actual payload need verification. An artifact digest alone is not authenticated
    provenance.
- key: blacksmith-runners
  title: 'Blacksmith: instance types and free units'
  url: https://docs.blacksmith.sh/blacksmith-runners/overview
  supports: The free pool is 3000 normalized x64 2-vCPU minutes per organization/month, with platform
    conversions; runner/app coverage matters.
  limits: This is a dated observation, not a guarantee of account entitlement, unlimited wall-clock minutes
    or a hard billing stop.
- key: blacksmith-settings
  title: 'Blacksmith: settings'
  url: https://docs.blacksmith.sh/introduction/settings
  supports: GitHub login, inherited organization membership and spending notification behavior.
  limits: An email alert after exceeding a threshold is not evidence of zero-overage enforcement.
- key: blacksmith-pricing
  title: 'Blacksmith: pricing'
  url: https://www.blacksmith.sh/pricing
  supports: Free and paid service surfaces and possible OSS arrangements are separate.
  limits: No sponsorship or approval for NDDev is established by this page; verify actual account and
    terms.
- key: cargo-cache
  title: 'Cargo: build cache'
  url: https://doc.rust-lang.org/cargo/reference/build-cache.html
  supports: Target outputs and intermediate build directories can have different locations; native tooling
    describes what is reusable.
  limits: Supported environment variables depend on Cargo version; build-dir layout alone does not establish
    cache correctness.
- key: cargo-config
  title: 'Cargo: configuration'
  url: https://doc.rust-lang.org/cargo/reference/config.html
  supports: Global download-cache cleanup is separate from project build-output retention.
  limits: Configuration defaults and availability must match the selected Cargo version.
- key: sccache-local
  title: 'sccache: local storage'
  url: https://github.com/mozilla/sccache/blob/main/docs/Local.md
  supports: Local backend ownership and bounded storage must match the server model.
  limits: Independent concurrent servers must not be assumed safe on one storage directory.
- key: sccache-rust
  title: 'sccache: Rust constraints'
  url: https://github.com/mozilla/sccache/blob/main/docs/Rust.md
  supports: Rust cache eligibility and incremental-compilation interactions constrain useful configurations.
  limits: The cache does not cover every linked result, and performance depends on workload.
- key: import-linter
  title: Import Linter
  url: https://import-linter.readthedocs.io/en/latest/index.html
  supports: Python import, layer and independence contracts are directly checkable.
  limits: Import graphs do not establish complete semantic architecture or all dynamic dependencies.
- key: dependency-cruiser
  title: dependency-cruiser
  url: https://github.com/sverweij/dependency-cruiser
  supports: Dependency graph rules can detect forbidden edges and cycles in JS/TS projects.
  limits: Project resolution settings and dynamic/framework entrypoints must be considered.
- key: archunit
  title: ArchUnit
  url: https://www.archunit.org/userguide/html/000_Index.html
  supports: JVM architecture tests can express dependency, layer and cycle constraints.
  limits: No fixed hexagonal directory skeleton or proof of all design quality follows.
- key: python-doctest
  title: 'Python: doctest'
  url: https://docs.python.org/3/library/doctest.html
  supports: Executable examples can be checked against actual program output.
  limits: Only executed examples are established; adjacent prose is not mechanically certified.
- key: slsa
  title: SLSA 1.2
  url: https://slsa.dev/spec/v1.2/
  supports: Build provenance describes source/build/artifact relationships and level-specific guarantees.
  limits: A checksum, self-written JSON record or local signature alone does not establish a SLSA level.
- key: docker-cache
  title: 'Docker: GitHub Actions cache backend'
  url: https://docs.docker.com/build/cache/backends/gha/
  supports: Cache scope and export/import choices affect BuildKit reuse and transfer costs.
  limits: A backend is not automatically free; cache mounts and final artifacts have distinct lifecycles.
- key: osv
  title: OSV-Scanner
  url: https://google.github.io/osv-scanner/
  supports: Native dependency and vulnerability analysis can support non-commercial-service-dependent
    scanning.
  limits: Database freshness, supported lock formats and tool errors need explicit handling.
- key: dora-feedback
  title: 'DORA: continuous integration'
  url: https://dora.dev/capabilities/continuous-integration/
  supports: Fast and reliable integrated feedback supports delivery quality.
  limits: Team-level empirical guidance does not prescribe a fixed number of agents, jobs, reruns or approvals.
- key: android-apkanalyzer
  title: 'Android Developers: apkanalyzer'
  url: https://developer.android.com/tools/apkanalyzer
  supports: The SDK can parse an actual APK binary manifest into XML.
  limits: A parsed manifest does not establish signing, application correctness or store acceptance.
- key: android-bundletool
  title: 'Android Developers: bundletool'
  url: https://developer.android.com/tools/bundletool
  supports: Native bundle validation and manifest inspection use the Android toolchain.
  limits: Toolchain availability must be established; structural validation does not certify signatures
    or stores.
- key: archived-native-fixtures
  title: Original native fixture source
  url: https://github.com/NDDev-Technocracy-Archive/ci-workflows/tree/481fc9e5e8411106a1f6effcd9372784b0f3f245/tests/fixtures
  supports: Original Python, Rust, Go, C++, Qt, Flutter, Node, Swift, R, SQL and Android fixtures adapted
    under tests/native with original grants and notices.
  limits: Original presence is not proof of executed native verification; current workflows select actual
    tests.
- key: archived-fuzz-fixtures
  title: Original fuzz harness source
  url: https://github.com/NDDev-Technocracy-Archive/ci-workflows-20261014/tree/4b53916e8a7b1c2dd220766b6dd4170a843f622e/tests/fixtures
  supports: Original Rust fuzz target and lock under rust/fuzz and C++ harness under fuzzing/checksum_fuzzer.cpp;
    adjacent native NOTICE files preserve their grants.
  limits: The public library does not import the earlier policy or paid capability platform.
