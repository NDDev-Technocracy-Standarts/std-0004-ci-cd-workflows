<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="title desc"><title id="title">Admission precedes native source checks and exact artifact delivery to an existing target</title><desc id="desc">Admission precedes native source checks and exact artifact delivery to an existing target. The adjacent README provides the text equivalent.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#83c6aa"/></marker></defs><rect width="600" height="300" rx="14" fill="#101a29"/><g font-family="ui-sans-serif,system-ui,sans-serif" fill="#f2f6fa"><text x="28" y="38" font-size="17" fill="#83c6aa" text-anchor="start">SOURCE TO EXISTING TARGET</text><rect x="28" y="72" width="155" height="70" rx="8" fill="#1c2b40" stroke="#83c6aa"/><text x="105.5" y="114.0" font-size="22" fill="#f2f6fa" text-anchor="middle">Native CI</text><rect x="223" y="72" width="155" height="70" rx="8" fill="#1c2b40" stroke="#83c6aa"/><text x="300.5" y="114.0" font-size="22" fill="#f2f6fa" text-anchor="middle">Artifact</text><rect x="418" y="72" width="155" height="70" rx="8" fill="#1c2b40" stroke="#83c6aa"/><text x="495.5" y="114.0" font-size="22" fill="#f2f6fa" text-anchor="middle">Target</text><path d="M184 107 L222 107" fill="none" stroke="#83c6aa" stroke-width="2" marker-end="url(#arrow)" /><path d="M379 107 L417 107" fill="none" stroke="#83c6aa" stroke-width="2" marker-end="url(#arrow)" /><text x="28" y="190" font-size="22" fill="#f2f6fa" text-anchor="start">Admission before allocation</text><text x="28" y="225" font-size="22" fill="#f2f6fa" text-anchor="start">Tested bytes move without rebuilding.</text><text x="28" y="278" font-size="17" fill="#b7c8dc" text-anchor="start">Public routes use GitHub on Linux, Windows and macOS.</text></g></svg>
