[project]
name = "nddev-cicd"
version = "0.6.23"
description = "Native shared CI/CD operations for thin GitHub workflows and composite actions"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.3,<7", "markdown-it-py>=3,<5", "defusedxml>=0.7.1,<1"]

[project.scripts]
nddev-cicd = "nddev_cicd.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.14,<1",
    "basedpyright>=1.29,<2",
    "import-linter>=2,<3",
    "zizmor==1.31.1",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv]
require-build-hashes = true
build-constraint-dependencies = [
    { requirement = "setuptools==84.2.1", hashes = ["sha256:ca140b45d5325a9478f880e351484f62fef15f336462e449ca0c03c873d589c2"] },
