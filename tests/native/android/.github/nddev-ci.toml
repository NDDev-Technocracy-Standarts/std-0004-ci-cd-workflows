schema=1
profiles=["android-kotlin"]
[commands.android-kotlin]
build=["bash","-c","./gradlew assembleDebug && mkdir -p \"$NDDEV_RESULT_DIR/mobile\" && cp app/build/outputs/apk/debug/app-debug.apk \"$NDDEV_RESULT_DIR/mobile/fixture.apk\""]
[environment]
GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2"
[artifacts]
files=["app/build/outputs/apk/debug/*.apk"]
[tools.java]
command=["java","-version"]
pattern='version "21[.]'
