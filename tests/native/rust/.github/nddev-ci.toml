schema=1
profiles=["rust"]
[tools.rust]
command=["rustc","--version"]
pattern="^rustc 1[.]"

[rust]
sccache=true
cache_budget_bytes=536870912
cache_min_free_bytes=1073741824
cache_ttl_seconds=86400
[extras.compiler-probe-a]
purpose="Measure eligible compilation in an independent fresh target without shared cleanup"
command=["cargo","build","--locked","--target-dir","target-probe-a"]
timeout=120
[extras.compiler-probe-b]
purpose="Measure reuse of the same compiler store in a second fresh target"
command=["cargo","build","--locked","--target-dir","target-probe-b"]
timeout=120
